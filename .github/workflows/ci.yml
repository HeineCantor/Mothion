name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ninja-build \
            ffmpeg \
            libeigen3-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          # aqtinstall names the Linux desktop build linux_gcc_64 from Qt 6.7 on.
          # Qt Sql (and its SQLite driver) is part of the base package; Multimedia (the audio track) is a module.
          modules: qtmultimedia
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMOTHION_BUILD_TESTS=ON
          -DMOTHION_BUILD_DEVTOOLS=OFF
          -DMOTHION_ENABLE_WINTAB=OFF

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-ci --output-on-failure --parallel 4

      # The same tests in the "C" locale, where Qt's locale-aware pieces (collation, number formats) behave
      # differently: it caught a sequence of images imported in the wrong order.
      - name: Test in the C locale
        env:
          QT_QPA_PLATFORM: offscreen
          LC_ALL: C
          LANG: C
        run: ctest --test-dir build-ci --output-on-failure --parallel 4

  # The tests again with the address and undefined-behaviour sanitizers: a bad access or an overflow stops the
  # test at once, with the place.
  sanitizers:
    name: Sanitizers (Ubuntu, ASan + UBSan)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ninja-build \
            ffmpeg \
            libeigen3-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          modules: qtmultimedia
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMOTHION_BUILD_TESTS=ON
          -DMOTHION_BUILD_DEVTOOLS=OFF
          -DMOTHION_ENABLE_WINTAB=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt and the system libraries leave allocations at exit that are not ours: leaks are not checked.
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure --parallel 4

  # The Windows build and tests: the program is made for Windows too (Windows Ink, minidumps), and only a build
  # there shows what the Linux one hides.
  windows:
    name: Build and test (Windows)
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64
          -DMOTHION_BUILD_TESTS=ON
          -DMOTHION_BUILD_DEVTOOLS=OFF
          -DMOTHION_ENABLE_WINTAB=OFF

      - name: Build
        run: cmake --build build-ci --config RelWithDebInfo --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-ci -C RelWithDebInfo --output-on-failure --parallel 4
